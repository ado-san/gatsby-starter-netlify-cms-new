<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
  <title id="t">A Raspberry Pi server powered by a solar panel and a battery</title>
  <rect width="800" height="450" fill="#eef6ea"/>
  <!-- sun -->
  <g transform="translate(120 95)">
    <circle r="42" fill="#f6b62b"/>
    <g stroke="#f6b62b" stroke-width="8" stroke-linecap="round">
      <line x1="0" y1="-62" x2="0" y2="-82"/><line x1="0" y1="62" x2="0" y2="82"/>
      <line x1="-62" y1="0" x2="-82" y2="0"/><line x1="62" y1="0" x2="82" y2="0"/>
      <line x1="44" y1="44" x2="58" y2="58"/><line x1="-44" y1="-44" x2="-58" y2="-58"/>
      <line x1="44" y1="-44" x2="58" y2="-58"/><line x1="-44" y1="44" x2="-58" y2="58"/>
    </g>
  </g>
  <!-- solar panel -->
  <g transform="translate(70 210)">
    <polygon points="20,0 230,0 260,120 -10,120" fill="#1f3b70"/>
    <g stroke="#7fa2db" stroke-width="3">
      <line x1="90" y1="0" x2="80" y2="120"/><line x1="160" y1="0" x2="170" y2="120"/>
      <line x1="10" y1="40" x2="240" y2="40"/><line x1="0" y1="80" x2="250" y2="80"/>
    </g>
    <rect x="115" y="120" width="20" height="70" fill="#5b6470"/>
    <rect x="70" y="186" width="110" height="12" rx="4" fill="#5b6470"/>
  </g>
  <!-- cables -->
  <path d="M330 330 C 370 330, 370 300, 400 300" fill="none" stroke="#2b2523" stroke-width="5"/>
  <path d="M500 300 C 530 300, 530 250, 560 250" fill="none" stroke="#2b2523" stroke-width="5"/>
  <!-- battery -->
  <g transform="translate(400 260)">
    <rect width="100" height="90" rx="10" fill="#2b2523"/>
    <rect x="18" y="-10" width="18" height="12" rx="3" fill="#2b2523"/>
    <rect x="64" y="-10" width="18" height="12" rx="3" fill="#2b2523"/>
    <rect x="14" y="16" width="72" height="58" rx="6" fill="#00b600"/>
    <path d="M54 24 L38 50 H50 L44 68 L64 40 H52 Z" fill="#fff"/>
  </g>
  <!-- raspberry pi board -->
  <g transform="translate(560 180)">
    <rect width="190" height="130" rx="10" fill="#1d8a3c"/>
    <g fill="#d4af37">
      <rect x="14" y="10" width="162" height="10" rx="2"/>
    </g>
    <rect x="30" y="40" width="54" height="54" rx="4" fill="#2b2b2b"/>
    <rect x="98" y="40" width="40" height="30" rx="3" fill="#2b2b2b"/>
    <rect x="150" y="38" width="40" height="34" rx="3" fill="#c0c4c8"/>
    <rect x="150" y="80" width="40" height="34" rx="3" fill="#c0c4c8"/>
    <rect x="98" y="80" width="40" height="34" rx="3" fill="#c0c4c8"/>
    <circle cx="12" cy="118" r="5" fill="#eef6ea"/><circle cx="178" cy="118" r="5" fill="#eef6ea"/>
    <!-- raspberry -->
    <g transform="translate(57 67)">
      <circle cx="-7" cy="-4" r="7" fill="#c51a4a"/><circle cx="7" cy="-4" r="7" fill="#c51a4a"/>
      <circle cx="0" cy="7" r="7" fill="#c51a4a"/>
      <path d="M-8 -12 Q0 -20 8 -12" fill="#75a928"/>
    </g>
  </g>
  <!-- cloud / web icons above the Pi -->
  <g transform="translate(655 95)" fill="none" stroke="#008f00" stroke-width="5" stroke-linecap="round">
    <path d="M-50 20 a24 24 0 0 1 10 -46 a32 32 0 0 1 60 6 a20 20 0 0 1 4 40 z" fill="#fff"/>
    <line x1="0" y1="34" x2="0" y2="70" stroke-dasharray="6 8"/>
  </g>
  <text x="400" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#2b2523">Self-hosting on 5 watts</text>
</svg>
