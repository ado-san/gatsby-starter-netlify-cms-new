[build]
  base = "next-preview"
  publish = "out"
  command = "npm run build"
  # With `base` set, Netlify skips builds when nothing changed inside next-preview/.
  # Blog posts (src/pages) and images (static/img, src/img) live outside it, so watch them too.
  # Exit 0 = skip the build, 1 = build. Runs from the base directory.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../src ../static ../netlify.toml"
[build.environment]
  NODE_VERSION = "22"
